spring.application.name=simple-rpg-auth
spring.banner.location=classpath:banner.txt

server.port=8089

# Users are shared with simple-rpg-ee (same H2 database file).
spring.datasource.url=jdbc:h2:file:../db/jakarta-ee-laboratory;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=

# Client Credentials Flow.
spring.security.oauth2.authorizationserver.client.m2m.registration.client-id=m2m-client
spring.security.oauth2.authorizationserver.client.m2m.registration.client-secret={noop}m2m-secret
spring.security.oauth2.authorizationserver.client.m2m.registration.authorization-grant-types[0]=client_credentials
spring.security.oauth2.authorizationserver.client.m2m.registration.client-authentication-methods[0]=client_secret_basic
spring.security.oauth2.authorizationserver.client.m2m.registration.client-authentication-methods[1]=client_secret_post

# Resource Owner Password Flow not supported by the Spring Authorization Server as it is deprecated in OAuth.

# Authorization Code Flow
spring.security.oauth2.authorizationserver.client.authorization.registration.client-id=authorization-client
spring.security.oauth2.authorizationserver.client.authorization.registration.client-secret={noop}authorization-secret
spring.security.oauth2.authorizationserver.client.authorization.registration.authorization-grant-types[0]=authorization_code
spring.security.oauth2.authorizationserver.client.authorization.registration.authorization-grant-types[1]=refresh_token
spring.security.oauth2.authorizationserver.client.authorization.registration.client-authentication-methods[0]=client_secret_basic
spring.security.oauth2.authorizationserver.client.authorization.registration.client-authentication-methods[1]=client_secret_post
spring.security.oauth2.authorizationserver.client.authorization.registration.redirect-uris[0]=http://localhost/cli
spring.security.oauth2.authorizationserver.client.authorization.registration.scopes[0]=read-write
spring.security.oauth2.authorizationserver.client.authorization.require-proof-key=false

# Authorization Code Flow with PKCE
spring.security.oauth2.authorizationserver.client.authorization-pkce.registration.client-id=authorization-pkce-client
spring.security.oauth2.authorizationserver.client.authorization-pkce.registration.authorization-grant-types[0]=authorization_code
spring.security.oauth2.authorizationserver.client.authorization-pkce.registration.authorization-grant-types[1]=refresh_token
spring.security.oauth2.authorizationserver.client.authorization-pkce.registration.client-authentication-methods[0]=none
spring.security.oauth2.authorizationserver.client.authorization-pkce.registration.redirect-uris[0]=http://localhost/cli
spring.security.oauth2.authorizationserver.client.authorization-pkce.registration.scopes[0]=read-write
spring.security.oauth2.authorizationserver.client.authorization-pkce.require-proof-key=true

# Authorization Code Flow for spring
spring.security.oauth2.authorizationserver.client.spring.registration.client-id=simple-rpg-spring
spring.security.oauth2.authorizationserver.client.spring.registration.client-secret={noop}spring-authorization-secret
spring.security.oauth2.authorizationserver.client.spring.registration.authorization-grant-types[0]=authorization_code
spring.security.oauth2.authorizationserver.client.spring.registration.authorization-grant-types[1]=refresh_token
spring.security.oauth2.authorizationserver.client.spring.registration.client-authentication-methods[0]=client_secret_basic
spring.security.oauth2.authorizationserver.client.spring.registration.client-authentication-methods[1]=client_secret_post
spring.security.oauth2.authorizationserver.client.spring.registration.redirect-uris[0]=http://localhost:8080/
spring.security.oauth2.authorizationserver.client.spring.registration.scopes[0]=read-write

# Authorization Code Flow for jakarta ee
spring.security.oauth2.authorizationserver.client.jakartaee.registration.client-id=simple-rpg-ee
spring.security.oauth2.authorizationserver.client.jakartaee.registration.client-secret={noop}jakarta-ee-authorization-secret
spring.security.oauth2.authorizationserver.client.jakartaee.registration.authorization-grant-types[0]=authorization_code
spring.security.oauth2.authorizationserver.client.jakartaee.registration.authorization-grant-types[1]=refresh_token
spring.security.oauth2.authorizationserver.client.jakartaee.registration.client-authentication-methods[0]=client_secret_basic
spring.security.oauth2.authorizationserver.client.jakartaee.registration.client-authentication-methods[1]=client_secret_post
spring.security.oauth2.authorizationserver.client.jakartaee.registration.redirect-uris[0]=http://localhost:9080/Callback
spring.security.oauth2.authorizationserver.client.jakartaee.registration.post-logout-redirect-uris[0]=http://localhost:9080/
spring.security.oauth2.authorizationserver.client.jakartaee.registration.scopes[0]=openid
spring.security.oauth2.authorizationserver.client.jakartaee.registration.scopes[1]=profile
spring.security.oauth2.authorizationserver.client.jakartaee.registration.scopes[2]=email
spring.security.oauth2.authorizationserver.client.jakartaee.registration.scopes[3]=read-write
spring.security.oauth2.authorizationserver.client.jakartaee.require-proof-key=false


# Authorization Code Flow with PKCE for Angular
spring.security.oauth2.authorizationserver.client.angular.registration.client-id=angular-client
spring.security.oauth2.authorizationserver.client.angular.registration.authorization-grant-types[0]=authorization_code
spring.security.oauth2.authorizationserver.client.angular.registration.authorization-grant-types[1]=refresh_token
spring.security.oauth2.authorizationserver.client.angular.registration.client-authentication-methods[0]=none
spring.security.oauth2.authorizationserver.client.angular.registration.redirect-uris[0]=http://localhost:4200/
spring.security.oauth2.authorizationserver.client.angular.registration.redirect-uris[1]=http://localhost:4200
spring.security.oauth2.authorizationserver.client.angular.registration.redirect-uris[2]=http://localhost:4200/characters
spring.security.oauth2.authorizationserver.client.angular.registration.redirect-uris[3]=http://localhost:4200/characters/
spring.security.oauth2.authorizationserver.client.angular.registration.redirect-uris[4]=http://localhost:4200/professions
spring.security.oauth2.authorizationserver.client.angular.registration.redirect-uris[5]=http://localhost:4200/professions/
spring.security.oauth2.authorizationserver.client.angular.registration.scopes[0]=openid
spring.security.oauth2.authorizationserver.client.angular.registration.scopes[1]=profile
spring.security.oauth2.authorizationserver.client.angular.registration.scopes[2]=email
spring.security.oauth2.authorizationserver.client.angular.registration.scopes[3]=read-write
spring.security.oauth2.authorizationserver.client.angular.require-proof-key=true

logging.level.org.springframework.security=trace
logging.level.org.springframework.security.oauth2=trace